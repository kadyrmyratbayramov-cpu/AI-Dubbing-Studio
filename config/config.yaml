# AI Dubbing Studio v1.0 Configuration

# Audio settings
audio:
  sample_rate: 22050
  channels: 1
  bit_depth: 16
  frame_length: 2048
  hop_length: 512

# Model settings
model:
  model_dir: "models"
  models_cache_dir: "models"
  default_model: "default_tts"
  default_voice: "en_US"
  default_speaker: "default"
  cache_models: true

# Processing settings
processing:
  normalize_audio: true
  remove_silence: false
  silence_threshold: 0.01
  fade_in_duration: 0.1
  fade_out_duration: 0.1

# Output settings
output:
  output_dir: "output"
  log_dir: "logs"
  debug: false

# Pipeline settings
pipeline:
  jobs_dir: "jobs"
  workspace_dir: "workspace"
  segment_seconds: 45
  retry_attempts: 3
  cleanup_intermediates: false
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"

# System settings
system:
  device: "auto"
  max_vram_mb: 7600
  log_level: "INFO"

# Engine settings
engines:
  whisper_model: "small"
  pyannote_model: "pyannote/speaker-diarization"
  xtts_model: "tts_models/multilingual/multi-dataset/xtts_v2"
  stt_sample_rate: 16000

# Dubbing settings
dubbing:
  language: "en"
  target_language: "en"
  voice_speed: 1.0
  pitch_shift: 0.0
