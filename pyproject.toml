[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dubbing-studio"
version = "2.0.0"
description = "Production-ready AI desktop dubbing studio"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Dubbing Studio Team" }]
keywords = ["ai", "dubbing", "whisper", "tts", "pyqt6", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.23.0",
    "pydantic>=1.10.0",
    "pyyaml>=6.0",
    "PyQt6>=6.6.0",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "scipy>=1.10.0",
    "pydub>=0.25.1",
    "torch>=2.2.0",
    "openai-whisper>=20240930",
    "transformers>=4.45.0",
    "sentencepiece>=0.2.0",
    "pyannote.audio>=3.3.2",
    "TTS>=0.22.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
]

[project.scripts]
ai-dubbing-studio = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
