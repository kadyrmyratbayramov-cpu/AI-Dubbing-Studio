[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dubbing-studio"
version = "1.1.0"
description = "Desktop AI dubbing studio with local-first media analysis and dubbing pipeline tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AI Dubbing Studio Team", email = "team@dubbing-studio.dev"}
]
keywords = ["ai", "dubbing", "desktop", "video", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video"
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "psutil>=5.9.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "mypy>=1.11.1"
]
desktop = [
    "opencv-python-headless>=4.10.0.84"
]
stt = [
    "faster-whisper>=1.0.3"
]
diarization = [
    "pyannote.audio>=3.3.2"
]
translation = [
    "transformers>=4.44.2",
    "sentencepiece>=0.2.0"
]
tts = [
    "TTS>=0.22.0"
]
lipsync = [
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0.84"
]
full = [
    "opencv-python-headless>=4.10.0.84",
    "faster-whisper>=1.0.3",
    "transformers>=4.44.2",
    "sentencepiece>=0.2.0",
    "TTS>=0.22.0",
    "ultralytics>=8.3.0"
]

[project.scripts]
ai-dubbing-studio = "src.app:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
